[package]
name = "solanaauth"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "solanaauth: portofol Solana me hyrje zkLogin, sesione me politika dhe passkey"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Build-i mainnet: vetëm verifying key-i zkLogin-main, pa key-n test.
mainnet = []

[dependencies]
zklogin-verifier = { path = "../zklogin-verifier", features = ["no-entrypoint"] }
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "ac9d959f9b14479c20c9d4f8168fa4cc47c13071" }
pinocchio = { version = "=0.10.2", features = ["cpi"] }
pinocchio-system = "=0.5.0"
solana-address = { version = "=2.9.0", features = ["syscalls", "sha2"] }
solana-sha256-hasher = "=3.1.0"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "=2.9.0", features = ["curve25519"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']

[dev-dependencies]
proptest = "=1.12.0"
