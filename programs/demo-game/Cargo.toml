[package]
name = "demo-game"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Lojë demo për solanaauth: çdo lojtar ka një PDA me pikët; `play` e rrit me 1"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = { version = "=0.10.2", features = ["cpi"] }
pinocchio-system = "=0.5.0"
solana-address = { version = "=2.9.0", features = ["syscalls"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "=2.9.0", features = ["curve25519"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
