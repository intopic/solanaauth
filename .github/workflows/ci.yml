name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      devnet:
        description: "Deploy në devnet dhe ekzekuto transaksione reale"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Solana CLI nga Anza (4.x). "stable" ndjek versionin e fundit stabël.
  SOLANA_RELEASE: stable

jobs:
  # 1. build: cargo build-sbf për programin; dështon nëse s'ndërtohet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_DEVNET == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_DEVNET == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_DEVNET == 'true'
        with:
          workspaces: |
            programs/zklogin-verifier
            programs/solanaauth
            programs/demo-game
      - uses: actions/cache@v4
        if: env.HAS_DEVNET == 'true'
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
          key: solana-${{ env.SOLANA_RELEASE }}-${{ runner.os }}-v1
      - name: Install Solana CLI (Anza)
        if: env.HAS_DEVNET == 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_RELEASE}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build program (SBF)
        if: env.HAS_DEVNET == 'true'
        run: |
          solana --version | tee solana-version.txt
          cargo build-sbf --manifest-path programs/zklogin-verifier/Cargo.toml
          cargo build-sbf --manifest-path programs/solanaauth/Cargo.toml
          cargo build-sbf --manifest-path programs/demo-game/Cargo.toml
          ls -l programs/zklogin-verifier/target/deploy/ programs/solanaauth/target/deploy/ programs/demo-game/target/deploy/
      - name: Build solanaauth (feature mainnet, vetëm kontroll)
        if: env.HAS_DEVNET == 'true'
        run: |
          cargo build-sbf --manifest-path programs/solanaauth/Cargo.toml --features mainnet --sbf-out-dir target/mainnet
          ls -l target/mainnet/
      - uses: actions/upload-artifact@v4
        if: env.HAS_DEVNET == 'true'
        with:
          name: program
          path: |
            programs/zklogin-verifier/target/deploy/zklogin_verifier.so
            programs/solanaauth/target/deploy/solanaauth.so
            programs/demo-game/target/deploy/demo_game.so
            solana-version.txt

  # 2. reference: verifikimi off-chain me kodin e Sui-t + konvertimi i key-ve.
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_DEVNET == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_DEVNET == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_DEVNET == 'true'
      - name: Verifying keys të konvertuara janë të përditësuara
        if: env.HAS_DEVNET == 'true'
        run: cargo run -q -p vk-convert -- --check
      - name: Off-chain reference verification (sui-crypto)
        if: env.HAS_DEVNET == 'true'
        run: cargo test -p reference -- --nocapture
      - name: Host tests (kodi i programit kundër referencës)
        if: env.HAS_DEVNET == 'true'
        run: cargo test -p bench --lib --test host -- --nocapture
      - name: Unit + property tests solanaauth (proptest, parsimi dhe politikat)
        if: env.HAS_DEVNET == 'true'
        run: cargo test --manifest-path programs/solanaauth/Cargo.toml -- --nocapture

  # 3. bench: programi në LiteSVM, matjet e CU dhe testet negative.
  bench:
    needs: [build, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_DEVNET == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_DEVNET == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_DEVNET == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_DEVNET == 'true'
        with:
          name: program
          path: artifact
      - name: Measure compute units
        if: env.HAS_DEVNET == 'true'
        env:
          ZKLOGIN_VERIFIER_SO: ${{ github.workspace }}/artifact/programs/zklogin-verifier/target/deploy/zklogin_verifier.so
        run: |
          export SOLANA_VERSION="$(cat artifact/solana-version.txt)"
          cargo test -p bench --test cu_report -- --nocapture
      - name: solanaauth (M2, M3) — skenari, testet negative, CU
        if: env.HAS_DEVNET == 'true'
        env:
          SOLANAAUTH_SO: ${{ github.workspace }}/artifact/programs/solanaauth/target/deploy/solanaauth.so
        run: |
          cargo test -p bench --test solanaauth -- --nocapture
          cargo test -p bench --test solanaauth_m3 -- --nocapture
      - name: Update README results table
        if: env.HAS_DEVNET == 'true'
        run: python3 scripts/update_readme.py
      - name: Job summary
        if: env.HAS_DEVNET == 'true'
        run: cat results/cu-report.md results/solanaauth-cu.md results/solanaauth-m3-cu.md results/solanaauth-accounts.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: env.HAS_DEVNET == 'true'
        with:
          name: cu-report
          path: |
            results/
            README.md

  # SDK-të (core, react, agent), shërbimet (salt, jwk-oracle, prover proxy, platforma me paymaster
  # dhe faturim), dashboard-i, faqja e portofolit dhe quickstart-i.
  # Testet e2e përdorin solanaauth.so nga build-i; vektorët Rust↔TS duhet të jenë të përditësuar.
  sdk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_DEVNET == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_DEVNET == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_DEVNET == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_DEVNET == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        if: env.HAS_DEVNET == 'true'
        with:
          name: program
          path: artifact
      - name: SDK vectors (Rust) janë të përditësuar
        if: env.HAS_DEVNET == 'true'
        env:
          CHECK_SDK_VECTORS: "1"
        run: cargo test -p bench --test sdk_vectors
      - run: npm ci --no-audit --no-fund
        if: env.HAS_DEVNET == 'true'
      - name: Build
        if: env.HAS_DEVNET == 'true'
        run: |
          npm run build -w sdk/core -w sdk/react -w sdk/agent -w sdk/wallet-standard -w services/salt -w services/jwk-oracle -w services/prover -w services/platform
          export VITE_PROGRAM_ID=11111111111111111111111111111111
          npm run build -w examples/quickstart -w examples/game -w apps/dashboard -w apps/wallet
      - name: Test
        if: env.HAS_DEVNET == 'true'
        env:
          SOLANAAUTH_SO: ${{ github.workspace }}/artifact/programs/solanaauth/target/deploy/solanaauth.so
          DEMO_GAME_SO: ${{ github.workspace }}/artifact/programs/demo-game/target/deploy/demo_game.so
        run: |
          for w in sdk/core sdk/react sdk/agent sdk/wallet-standard services/salt services/jwk-oracle services/prover services/platform examples/game examples/agent-x402; do
            echo "::group::$w"
            (cd "$w" && node --test --test-timeout=120000 test/*.test.mjs)
            echo "::endgroup::"
          done

  # 4. publish (vetëm në main): commit i results/ dhe i tabelës në README; Release në tag v*.
  publish:
    needs: [bench, sdk]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_DEVNET == 'true'
        with:
          ref: main
      - uses: actions/download-artifact@v4
        if: env.HAS_DEVNET == 'true'
        with:
          name: cu-report
          path: .
      - name: Publish results to main
        if: env.HAS_DEVNET == 'true' && (github.ref == 'refs/heads/main')
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add results/ README.md
          if git diff --cached --quiet; then
            echo "Asnjë ndryshim në rezultate."
          else
            git commit -m "ci: update CU results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Create GitHub Release (tags v*)
        if: env.HAS_DEVNET == 'true' && (startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" results/cu-report.md results/cu-report.json \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file results/cu-report.md

  # Devnet E2E: në çdo push në `main` (dhe manualisht: Actions → ci → Run workflow → devnet = true).
  # Kërkon secret-in DEVNET_DEPLOYER_KEYPAIR (vetëm devnet, pa vlerë reale). Në push kërkon edhe
  # DEVNET_PROGRAM_KEYPAIR dhe DEVNET_SOLANAAUTH_PROGRAM_KEYPAIR, që çdo push të bëjë upgrade të të
  # njëjtave programe në vend që të krijojë programe të reja. Pa to puna kalohet me shënim.
  devnet:
    if: (github.event_name == 'workflow_dispatch' && inputs.devnet) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [bench, sdk]
    runs-on: ubuntu-latest
    env:
      HAS_DEVNET: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR != '' && (github.event_name == 'workflow_dispatch' || (secrets.DEVNET_PROGRAM_KEYPAIR != '' && secrets.DEVNET_SOLANAAUTH_PROGRAM_KEYPAIR != '')) }}
    steps:
      - name: Secrets devnet
        if: env.HAS_DEVNET != 'true'
        run: |
          echo "::notice::Devnet E2E u kalua: mungon DEVNET_DEPLOYER_KEYPAIR (ose, në push, DEVNET_PROGRAM_KEYPAIR / DEVNET_SOLANAAUTH_PROGRAM_KEYPAIR)."
          echo "Devnet E2E u kalua: mungojnë secrets devnet." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_DEVNET == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_DEVNET == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_DEVNET == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_DEVNET == 'true'
        with:
          node-version: 20
      - name: Install Solana CLI (Anza)
        if: env.HAS_DEVNET == 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_RELEASE}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        if: env.HAS_DEVNET == 'true'
        with:
          name: program
          path: artifact
      - name: Deploy and run on devnet
        if: env.HAS_DEVNET == 'true'
        env:
          # Vetëm çelësa devnet pa vlerë reale. Asnjë çelës mainnet.
          DEVNET_DEPLOYER_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
          DEVNET_PROGRAM_KEYPAIR: ${{ secrets.DEVNET_PROGRAM_KEYPAIR }}
          DEVNET_SOLANAAUTH_PROGRAM_KEYPAIR: ${{ secrets.DEVNET_SOLANAAUTH_PROGRAM_KEYPAIR }}
        run: |
          mkdir -p programs/zklogin-verifier/target/deploy programs/solanaauth/target/deploy
          cp artifact/programs/zklogin-verifier/target/deploy/zklogin_verifier.so programs/zklogin-verifier/target/deploy/
          cp artifact/programs/solanaauth/target/deploy/solanaauth.so programs/solanaauth/target/deploy/
          bash scripts/devnet.sh
      - name: Job summary
        if: env.HAS_DEVNET == 'true' && (always())
        run: cat results/devnet-report.md results/devnet-solanaauth.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: env.HAS_DEVNET == 'true' && (always())
        with:
          name: devnet-report
          path: results/devnet-*.md
          if-no-files-found: ignore
      - name: Publish devnet report to main
        if: env.HAS_DEVNET == 'true' && (github.ref == 'refs/heads/main')
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add results/devnet-*.md
          git commit -m "ci: devnet report [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
