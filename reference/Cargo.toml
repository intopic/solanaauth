[package]
name = "reference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Verifikimi off-chain i provës zkLogin me kodin e Sui-t (e vërteta referencë)"

[dependencies]
# Verifikuesi zkLogin i Sui-t (arkworks), i njëjti kod që përdorin klientët Rust të Sui-t.
sui-crypto = { version = "=0.4.0", features = ["zklogin", "ed25519"] }
sui-sdk-types = { version = "=0.4.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64ct = { version = "1.8", features = ["alloc"] }
# Vetëm për rillogaritjen e address_seed (Poseidon i pajtueshëm me Circom).
light-poseidon = "0.4"
ark-bn254 = "0.5"
ark-ff = "0.5"
num-bigint = "0.4"
